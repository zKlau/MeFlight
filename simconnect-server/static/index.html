<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeFlight Recorder</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/static/style.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body>
    <header class="topbar">
      <h1>MeFlight Recorder</h1>
      <div class="pills">
        <span class="pill" id="sim-pill">MSFS: …</span>
        <span class="pill" id="recording-pill">Idle</span>
      </div>
    </header>

    <main class="layout">
      <section class="card">
        <h2>Record</h2>
        <label class="field">
          Flight plan
          <select id="plan-select"></select>
        </label>
        <div class="actions">
          <button id="start-button" class="primary">Start recording</button>
          <button id="stop-button">Stop</button>
        </div>
        <dl class="stats" id="live-stats"></dl>
        <p class="error" id="status-error"></p>
      </section>

      <section class="card">
        <h2>Resume</h2>
        <p class="muted" id="resume-hint">Select a flight plan to see where you left the aircraft.</p>
        <div id="resume-details"></div>
        <div class="actions">
          <button id="restore-fuel-button" class="primary" disabled>Restore saved fuel in MSFS</button>
        </div>
        <p class="muted" id="restore-result"></p>
      </section>

      <section class="card">
        <h2>Upload flight plan</h2>
        <label class="field">
          MSFS .PLN file
          <input type="file" id="pln-input" accept=".pln,.PLN,.xml" />
        </label>
        <div class="actions">
          <button id="upload-button" class="primary">Upload</button>
        </div>
        <p class="muted" id="upload-result"></p>
      </section>

      <section class="card wide">
        <h2>Flight plans</h2>
        <ul class="plan-list" id="plan-list"></ul>
      </section>

      <section class="card wide">
        <div class="editor__header">
          <h2>Edit route</h2>
          <span class="editor__status" id="editor-status"></span>
          <label class="editor__speed">
            Cruise speed
            <input type="number" class="editor-input" id="editor-speed" min="30" max="1000" step="10" />
            kts
          </label>
          <div class="actions">
            <button id="editor-add" disabled>Add point on map</button>
            <button id="editor-discard" disabled>Discard</button>
            <button id="editor-save" class="primary" disabled>Save route</button>
          </div>
        </div>
        <p class="muted" id="editor-hint"></p>
        <p class="editor__summary" id="editor-summary"></p>
        <div class="editor__body" id="editor-body" hidden>
          <div class="editor__map" id="editor-map"></div>
          <div class="editor__side">
            <div id="editor-form"></div>
            <ol class="editor-list" id="editor-list"></ol>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/static/js/main.js"></script>
  </body>
</html>
