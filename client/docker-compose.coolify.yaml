services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8011}:80"
    expose:
      - "80"
    environment:
      SERVICE_URL_WEB_80:
      API_URL: ${API_URL:?Public URL of the MeFlight backend, e.g. https://api.example.com}
