services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-8010}:8000"
    expose:
      - "8000"
    environment:
      SERVICE_URL_API_8000:
      DATABASE_URL: ${DATABASE_URL:?Paste the Postgres internal URL from your Coolify database}
      API_KEY: ${API_KEY:?}
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
